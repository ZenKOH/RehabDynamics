[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "rehabdynamics"
version = "0.1.0"
description = "Uncertainty-aware movement intelligence and benchmarking for rehabilitation biomechanics"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "RehabDynamics contributors" }]
dependencies = [
  "numpy>=1.24,<3",
  "pandas>=2.0,<3",
  "pydantic>=2.6,<3",
  "pyyaml>=6.0,<7",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.9,<1"]
ui = ["streamlit>=1.37,<2", "plotly>=5.22,<7"]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.6,<1", "mypy>=1.11,<2", "httpx>=0.27,<1"]
all = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.9,<1",
  "streamlit>=1.37,<2", "plotly>=5.22,<7",
]

[project.scripts]
rehabdynamics = "rehabdynamics.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/rehabdynamics"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["rehabdynamics"]
